<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes liens de cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbfbf7;
    --grid: #d6e0f0;
    --ink: #1b2a6b;
    --margin: #d9433b;
    --marker: #ffe45c;
    --text: #1d2233;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    color: var(--text);
    background-color: var(--paper);
    /* papier à carreaux */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    line-height: 1.5;
  }
  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 24px 72px 56px;
    min-height: 100vh;
    background: rgba(251, 251, 247, 0.9);
    border-left: 2px solid var(--margin); /* marge rouge du cahier */
    margin-left: max(24px, calc((100vw - 860px) / 2));
  }
  h1 {
    font-size: clamp(2.4rem, 7vw, 4rem);
    line-height: 1;
    margin: 0 0 12px;
    color: var(--ink);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  h1 span { background: linear-gradient(transparent 60%, var(--marker) 60%); }
  .intro { margin: 0 0 32px; max-width: 52ch; }

  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  nav button {
    font: inherit;
    font-weight: 600;
    padding: 8px 16px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    cursor: pointer;
  }
  nav button:hover { background: #eef1fb; }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  nav button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid var(--margin);
    outline-offset: 2px;
  }

  h2 { color: var(--ink); font-size: 1.6rem; margin: 0 0 16px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-bottom: 1px solid var(--grid); }
  li a {
    display: block;
    padding: 14px 4px;
    text-decoration: none;
    color: var(--text);
  }
  li a strong { color: var(--ink); font-size: 1.1rem; }
  li a span { display: block; font-size: 0.95rem; opacity: 0.8; }
  li a:hover strong { text-decoration: underline; text-decoration-thickness: 3px; text-decoration-color: var(--marker); }

  footer { margin-top: 40px; font-size: 0.9rem; opacity: 0.7; }
  @media (max-width: 600px) {
    .page { padding: 32px 16px 48px 24px; margin-left: 12px; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>Mes <span>liens de cours</span></h1>
  <p class="intro">Choisis une matière pour voir les sites utiles : cours, exercices, outils et dictionnaires.</p>

  <nav id="tabs" role="tablist" aria-label="Matières"></nav>
  <section id="content" role="tabpanel" aria-live="polite"></section>

  <footer>Pour ajouter un lien, modifie la liste <code>matieres</code> dans le fichier index.html.</footer>
</main>

<script>
  // === À MODIFIER : ajoute tes matières et tes liens ici ===
  const matieres = [
    {
      nom: "Maths",
      liens: [
        { titre: "Khan Academy", desc: "Cours et exercices de maths pas à pas.", url: "https://fr.khanacademy.org/math" },
        { titre: "GeoGebra", desc: "Tracer des fonctions et de la géométrie.", url: "https://www.geogebra.org" },
        { titre: "Desmos", desc: "Calculatrice graphique en ligne.", url: "https://www.desmos.com/calculator" },
        { titre: "WolframAlpha", desc: "Vérifier un calcul, une dérivée, une intégrale.", url: "https://www.wolframalpha.com" }
      ]
    },
    {
      nom: "Physique et électronique",
      liens: [
        { titre: "PhET", desc: "Simulations interactives de physique et de chimie.", url: "https://phet.colorado.edu/fr/" },
        { titre: "Falstad Circuit", desc: "Simuler un circuit électronique dans le navigateur.", url: "https://www.falstad.com/circuit/" },
        { titre: "Khan Academy Sciences", desc: "Cours de physique, chimie et biologie.", url: "https://fr.khanacademy.org/science" }
      ]
    },
    {
      nom: "Informatique",
      liens: [
        { titre: "MDN Web Docs", desc: "La référence pour HTML, CSS et JavaScript.", url: "https://developer.mozilla.org/fr/" },
        { titre: "France-IOI", desc: "S’entraîner à programmer avec des exercices.", url: "https://www.france-ioi.org" },
        { titre: "GitHub Docs", desc: "Apprendre à utiliser GitHub.", url: "https://docs.github.com/fr" }
      ]
    },
    {
      nom: "Français",
      liens: [
        { titre: "Reverso Conjugaison", desc: "Conjuguer n’importe quel verbe.", url: "https://conjugaison.reverso.net/conjugaison/" },
        { titre: "CNRTL", desc: "Dictionnaire, synonymes et étymologie.", url: "https://www.cnrtl.fr" },
        { titre: "Lumni", desc: "Cours et vidéos pour tous les niveaux.", url: "https://www.lumni.fr" }
      ]
    },
    {
      nom: "Anglais",
      liens: [
        { titre: "WordReference", desc: "Dictionnaire anglais-français avec forums.", url: "https://www.wordreference.com" },
        { titre: "Linguee", desc: "Traductions avec exemples en contexte.", url: "https://www.linguee.fr" },
        { titre: "Cambridge Dictionary", desc: "Définitions et prononciation.", url: "https://dictionary.cambridge.org" }
      ]
    },
    {
      nom: "Histoire-géo",
      liens: [
        { titre: "Lumni", desc: "Vidéos et cours d’histoire-géographie.", url: "https://www.lumni.fr" },
        { titre: "Géoportail", desc: "Cartes officielles de la France.", url: "https://www.geoportail.gouv.fr" },
        { titre: "Wikipédia", desc: "Pour une première vue d’ensemble d’un sujet.", url: "https://fr.wikipedia.org" }
      ]
    }
  ];
  // =========================================================

  const tabs = document.getElementById("tabs");
  const content = document.getElementById("content");

  function show(index) {
    const m = matieres[index];
    [...tabs.children].forEach((b, i) => b.setAttribute("aria-selected", i === index));
    content.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = m.nom;
    const ul = document.createElement("ul");
    m.liens.forEach(l => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      const s = document.createElement("strong");
      s.textContent = l.titre;
      const d = document.createElement("span");
      d.textContent = l.desc;
      a.append(s, d);
      li.append(a);
      ul.append(li);
    });
    content.append(h, ul);
    history.replaceState(null, "", "#" + encodeURIComponent(m.nom));
  }

  matieres.forEach((m, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.textContent = m.nom;
    b.addEventListener("click", () => show(i));
    tabs.append(b);
  });

  const start = matieres.findIndex(m => "#" + encodeURIComponent(m.nom) === location.hash);
  show(start >= 0 ? start : 0);
</script>
</body>
</html>
